<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL NOOR ONLINE STORE</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        /* Intro Screen */
        #intro {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #intro h1 {
            color: #00ffcc;
            font-size: 40px;
            animation: zoom 2s ease-in-out;
        }

        @keyframes zoom {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #main {
            display: none;
            padding: 20px;
        }

        h2, h3, p {
            color: white;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: #222;
            width: 220px;
            border-radius: 12px;
            padding: 15px;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .buy-btn {
            display: inline-block;
            background: #00ffcc;
            color: black;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
        }

        .buy-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <!-- Intro -->
    <div id="intro">
        <h1>AL NOOR ONLINE STORE</h1>
    </div>

    <!-- Main Content -->
    <div id="main">

        <h2>🛒 AL NOOR ONLINE STORE</h2>

        <div class="products">

            <div class="card">
                <img src="{{ url_for('static', filename='watch.jpg') }}" alt="Smart Watch">
                <h3>Smart Watch</h3>
                <p>Rs. 799</p>
                <a class="buy-btn" href="https://wa.me/923001234567?text=Assalamualaikum,%20mujhe%20Smart%20Watch%20order%20karni%20hai.">
                    Buy Now
                </a>
            </div>

            <div class="card">
                <img src="{{ url_for('static', filename='hand_free.png') }}" alt="Hand Free">
                <h3>Hand Free</h3>
                <p>Rs. 499</p>
                <a class="buy-btn" href="https://wa.me/923001234567?text=Assalamualaikum,%20mujhe%20Hand%20Free%20order%20karni%20hai.">
                    Buy Now
                </a>
            </div>

            <div class="card">
                <img src="{{ url_for('static', filename='mobile_glass.jpg') }}" alt="Mobile Glass">
                <h3>Mobile Glass</h3>
                <p>Rs. 299</p>
                <a class="buy-btn" href="https://wa.me/923001234567?text=Assalamualaikum,%20mujhe%20Mobile%20Glass%20order%20karni%20hai.">
                    Buy Now
                </a>
            </div>

            <div class="card">
                <img src="{{ url_for('static', filename='fast_charger.jpg') }}" alt="Fast Charger">
                <h3>Fast Charger</h3>
                <p>Rs. 699</p>
                <a class="buy-btn" href="https://wa.me/923001234567?text=Assalamualaikum,%20mujhe%20Fast%20Charger%20order%20karna%20hai.">
                    Buy Now
                </a>
            </div>

        </div>

    </div>

    <script>
        setTimeout(function () {
            document.getElementById("intro").style.display = "none";
            document.getElementById("main").style.display = "block";
        }, 3000);
    </script>

</body>
</html>
