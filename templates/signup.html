<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AL NOOR STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 255, 204, 0.25);
            border: 1px solid rgba(0, 255, 204, 0.35);
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
            letter-spacing: 2px;
        }

        .header p {
            color: #aaa;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #00ffcc;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 204, 0.25);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input:focus {
            outline: none;
            border-color: #00ffcc;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            transform: scale(1.02);
        }

        input::placeholder {
            color: #777;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ffcc, #00b894, #00ffcc);
            background-size: 200% 200%;
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.45);
            background-position: 100% 0;
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .error {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 0, 0, 0.08));
            border: 1px solid #ff4444;
            color: #ff6b6b;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .footer {
            margin-top: 35px;
            text-align: center;
        }

        .footer p {
            color: #aaa;
            font-size: 14px;
        }

        .footer a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
        }

        .footer a:hover {
            color: #00b894;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .footer a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background: linear-gradient(90deg, #00ffcc, #00b894);
            transition: width 0.3s ease;
        }

        .footer a:hover::after {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ url_for('static', filename='images/glass_protector.jpg') }}" 
                 alt="Logo" 
                 style="width: 180px; height: 180px; border-radius: 20px; object-fit: cover; border: 4px solid #00ffcc; box-shadow: 0 0 25px rgba(0, 255, 204, 0.5); margin-bottom: 15px;">
            <h1>AL NOOR</h1>
            <p>Create an account to get started</p>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create your password" required>
            </div>

            <button type="submit" class="btn">Sign Up</button>
        </form>

        <div class="footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</body>
</html>
