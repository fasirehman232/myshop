<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | AL NOOR STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-link.store {
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .nav-link.store:hover {
            background: rgba(0, 255, 204, 0.3);
        }

        .nav-link.logout {
            background: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .nav-link.logout:hover {
            background: rgba(255, 77, 77, 0.3);
        }

        /* Add Product Section */
        .add-product {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .add-product h2 {
            color: #00ffcc;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(0, 255, 204, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn-add {
            background: linear-gradient(135deg, #00ffcc, #00b894);
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            color: #000;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.3);
        }

        /* Products Section */
        .products-section {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        .products-section h2 {
            color: #00ffcc;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .products-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: rgba(34, 34, 34, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .product-card h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 18px;
        }

        .product-card .price {
            color: #00ffcc;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .product-card .image-name {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .btn-delete {
            background: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.4);
            padding: 8px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-delete:hover {
            background: rgba(255, 77, 77, 0.3);
        }

        .no-products {
            color: #888;
            font-size: 16px;
            text-align: center;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛠️ Admin Panel - AL NOOR STORE</h1>
            <div class="nav-links">
                <a href="{{ url_for('store') }}" class="nav-link store">Go to Store</a>
                <a href="{{ url_for('logout') }}" class="nav-link logout">Logout</a>
            </div>
        </div>

        <!-- Add Product -->
        <div class="add-product">
            <h2>➕ Add New Product</h2>
            <form method="POST" action="{{ url_for('add') }}">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" name="name" placeholder="e.g., Smart Watch" required>
                    </div>
                    <div class="form-group">
                        <label>Price (Rs.)</label>
                        <input type="text" name="price" placeholder="e.g., 799" required>
                    </div>
                    <div class="form-group">
                        <label>Image Filename</label>
                        <input type="text" name="image" placeholder="e.g., images/watch.jpg" required>
                    </div>
                </div>
                <button type="submit" class="btn-add">Add Product</button>
            </form>
        </div>

        <!-- Products List -->
        <div class="products-section">
            <h2>📦 All Products</h2>
            {% if products %}
            <div class="products-list">
                {% for p in products %}
                <div class="product-card">
                    <h3>{{ p[1] }}</h3>
                    <p class="price">Rs. {{ p[2] }}</p>
                    <p class="image-name">Image: {{ p[3] }}</p>
                    <a href="{{ url_for('delete', id=p[0]) }}" class="btn-delete">Delete</a>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p class="no-products">No products yet. Add your first product above!</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
