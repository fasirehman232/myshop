<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | AL NOOR STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            padding: 30px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 35px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            color: #00ffcc;
            font-size: 32px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 12px 28px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        .nav-link.store {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.2), rgba(0, 255, 204, 0.1));
            color: #00ffcc;
            border: 1px solid rgba(0, 255, 204, 0.35);
        }

        .nav-link.store:hover {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.3), rgba(0, 255, 204, 0.2));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.25);
        }

        .nav-link.logout {
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.2), rgba(255, 0, 0, 0.1));
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.35);
        }

        .nav-link.logout:hover {
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.3), rgba(255, 0, 0, 0.2));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.25);
        }

        /* Add Product Section */
        .add-product {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 18px;
            margin-bottom: 35px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .add-product h2 {
            color: #00ffcc;
            margin-bottom: 30px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: #aaa;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(0, 255, 204, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            transition: all 0.4s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ffcc;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
        }

        .form-group input::placeholder {
            color: #777;
        }

        .btn-add {
            background: linear-gradient(135deg, #00ffcc, #00b894, #00ffcc);
            background-size: 200% 200%;
            border: none;
            padding: 14px 40px;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-add:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(0, 255, 204, 0.4);
            background-position: 100% 0;
        }

        /* Products Section */
        .products-section {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 18px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .products-section h2 {
            color: #00ffcc;
            margin-bottom: 35px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .products-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: rgba(34, 34, 34, 0.75);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 255, 204, 0.2);
            border-color: rgba(0, 255, 204, 0.4);
        }

        .product-card h3 {
            color: #fff;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .product-card .price {
            color: #00ffcc;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .product-card .image-name {
            color: #777;
            font-size: 13px;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .btn-delete {
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.2), rgba(255, 0, 0, 0.1));
            color: #ff4d4d;
            border: 1px solid rgba(255, 77, 77, 0.4);
            padding: 10px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-delete:hover {
            background: linear-gradient(135deg, rgba(255, 77, 77, 0.3), rgba(255, 0, 0, 0.2));
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.25);
        }

        .no-products {
            color: #777;
            font-size: 17px;
            text-align: center;
            padding: 50px;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div style="display: flex; align-items: center; gap: 20px;">
                <!-- Circular Logo - Fallback to watch.jpg if logo missing -->
                <img src="{{ url_for('static', filename='images/watch.jpg') }}" 
                     alt="Logo" 
                     style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #00ffcc; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);">
                <h1>🛠️ Admin Panel</h1>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('store') }}" class="nav-link store">Go to Store</a>
                <a href="{{ url_for('logout') }}" class="nav-link logout">Logout</a>
            </div>
        </div>

        <!-- Add Product -->
        <div class="add-product">
            <h2>➕ Add New Product</h2>
            <form method="POST" action="{{ url_for('add') }}" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" name="name" placeholder="e.g. Smart Watch" required>
                    </div>
                    <div class="form-group">
                        <label>Price (Rs.)</label>
                        <input type="text" name="price" placeholder="e.g. 799" required>
                    </div>
                    <div class="form-group">
                        <label>Product Image</label>
                        <input type="file" name="image" accept="image/*" required>
                    </div>
                </div>
                <button type="submit" class="btn-add">Add Product</button>
            </form>
        </div>

        <!-- Products List -->
        <div class="products-section">
            <h2>📦 All Products</h2>
            {% if products %}
            <div class="products-list">
                {% for p in products %}
                <div class="product-card">
                    <img src="{{ url_for('static', filename=p[3]) }}" alt="{{ p[1] }}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px;">
                    <h3>{{ p[1] }}</h3>
                    <p class="price">Rs. {{ p[2] }}</p>
                    <p class="image-name">Image: {{ p[3] }}</p>
                    <a href="{{ url_for('delete', id=p[0]) }}" class="btn-delete">🗑️ Delete</a>
                </div>
                {% endfor %}
            </div>
            {% else %}
            <p class="no-products">No products yet. Add your first product above!</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
