<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AL NOOR STORE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 255, 204, 0.25);
            border: 1px solid rgba(0, 255, 204, 0.35);
            text-align: center;
        }

        /* ✅ IMAGE FIX */
        .logo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            margin-bottom: 15px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 36px;
            margin-bottom: 5px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            color: #00ffcc;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,255,204,0.25);
            border-radius: 10px;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ffcc, #00b894);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            transform: scale(1.03);
        }

        .error {
            background: rgba(255,0,0,0.1);
            border: 1px solid red;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
        }

        .footer a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ✅ FIXED IMAGE -->
    <img src="{{ url_for('static', filename='mobile_glass.jpg') }}" class="logo" alt="Logo">

    <div class="header">
        <h1>AL NOOR</h1>
        <p>Welcome back! Please login to continue</p>
    </div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="footer">
        Don't have an account?
        <a href="{{ url_for('signup') }}">Create Account</a>
    </div>

</div>

</body>
</html>
