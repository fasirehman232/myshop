<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL NOOR ONLINE STORE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to bottom, #111, #1a1a1a);
    color: white;
    text-align: center;
}

/* INTRO */
#intro {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#intro h1 {
    color: #00ffcc;
    font-size: 42px;
    animation: zoom 2s ease-in-out;
}

@keyframes zoom {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

#main {
    display: none;
    padding: 30px 20px;
}

h2 {
    margin-bottom: 30px;
    font-size: 32px;
}

/* PRODUCTS GRID */
.products {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

/* CARD */
.card {
    width: 240px;
    background: #222;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;

    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* ONLY ONE CARD HOVER EFFECT */
.card:hover {
    transform: translateY(-10px) scale(1.03);
    box-shadow: 0 15px 30px rgba(0, 255, 204, 0.3);
}

/* IMAGE */
.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;

    transition: transform 0.5s ease;
}

/* ONLY HOVERED CARD IMAGE ZOOM */
.card:hover img {
    transform: scale(1.08);
}

/* CONTENT */
.card-content {
    padding: 15px;
}

.card h3 {
    margin-bottom: 10px;
}

.price {
    color: #00ffcc;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* BUTTON */
.buy-btn {
    display: inline-block;
    background: #00ffcc;
    color: black;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s ease;
}

.buy-btn:hover {
    background: white;
    transform: scale(1.05);
}

/* MOBILE */
@media (max-width: 600px) {
    .card {
        width: 90%;
    }

    h2 {
        font-size: 24px;
    }

    #intro h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>AL NOOR ONLINE STORE</h1>
</div>

<!-- MAIN -->
<div id="main">

    <h2>🛒 AL NOOR ONLINE STORE</h2>

    <div class="products">

        <div class="card">
            <img src="{{ url_for('static', filename='watch.jpg') }}">
            <div class="card-content">
                <h3>Smart Watch</h3>
                <p class="price">Rs. 799</p>
                <a class="buy-btn" href="#">Buy Now</a>
            </div>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='hand_free.png') }}">
            <div class="card-content">
                <h3>Hand Free</h3>
                <p class="price">Rs. 499</p>
                <a class="buy-btn" href="#">Buy Now</a>
            </div>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='mobile_glass.jpg') }}">
            <div class="card-content">
                <h3>Mobile Glass</h3>
                <p class="price">Rs. 299</p>
                <a class="buy-btn" href="#">Buy Now</a>
            </div>
        </div>

        <div class="card">
            <img src="{{ url_for('static', filename='fast_charger.jpg') }}">
            <div class="card-content">
                <h3>Fast Charger</h3>
                <p class="price">Rs. 699</p>
                <a class="buy-btn" href="#">Buy Now</a>
            </div>
        </div>

    </div>
</div>

<!-- SCRIPT -->
<script>
setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";
}, 3000);
</script>

</body>
</html>
