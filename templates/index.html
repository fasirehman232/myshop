<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL NOOR ONLINE STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Intro Screen */
        #intro {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
        }

        #intro h1 {
            font-size: 52px;
            color: #00ffcc;
            animation: zoom 2s ease-in-out;
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            letter-spacing: 3px;
        }

        @keyframes zoom {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            padding: 25px 40px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header img {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            object-fit: cover;
            border: 3px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        .header h1 {
            color: #00ffcc;
            font-size: 28px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            letter-spacing: 2px;
        }

        .nav-link {
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            font-size: 15px;
            border: 2px solid rgba(0, 255, 204, 0.35);
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.2), rgba(0, 255, 204, 0.1));
            color: #00ffcc;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, rgba(0, 255, 204, 0.3), rgba(0, 255, 204, 0.2));
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 204, 0.25);
        }

        /* Main Content */
        #main {
            display: none;
            padding: 50px 30px;
        }

        .page-title {
            text-align: center;
            font-size: 38px;
            margin-bottom: 50px;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            letter-spacing: 1px;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            justify-items: center;
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            max-width: 320px;
            background: rgba(34, 34, 34, 0.75);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 204, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.03);
            box-shadow: 0 30px 70px rgba(0, 255, 204, 0.25);
            border-color: rgba(0, 255, 204, 0.4);
        }

        .card-image-container {
            width: 100%;
            height: 260px;
            overflow: hidden;
            position: relative;
            background: #222;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover img {
            transform: scale(1.2);
        }

        .card-content {
            padding: 28px;
            text-align: center;
        }

        .card-content h3 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .card-content .price {
            color: #00ffcc;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .buy-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00ffcc, #00b894, #00ffcc);
            background-size: 200% 200%;
            color: #000;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            transition: all 0.4s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .buy-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 255, 204, 0.4);
            background-position: 100% 0;
        }

        .no-products {
            text-align: center;
            color: #777;
            font-size: 18px;
            padding: 60px;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <!-- Intro Screen -->
    <div id="intro">
        <h1>AL NOOR ONLINE STORE</h1>
    </div>

    <!-- Main Store -->
    <div id="main">
        <!-- Header -->
        <div class="header">
            <div class="logo-section">
                <img src="{{ url_for('static', filename='mobile_glass.jpg') }}" alt="Logo">
                <h1>🛒 AL NOOR STORE</h1>
            </div>
            <a href="{{ url_for('login') }}" class="nav-link">🔐 Admin Login</a>
        </div>

        <h2 class="page-title">Our Products</h2>

        <div class="products">
            {% if products %}
                {% for p in products %}
                <div class="card">
                    <div class="card-image-container">
                        <img src="{{ url_for('static', filename=p[3].split('/static/', 1)[1]) if p[3] and p[3]|is_local else (p[3] if p[3] else 'https://picsum.photos/300/260?random=' + p[0]|string) }}" alt="{{ p[1] }}" onerror="this.src='https://picsum.photos/300/260'">
                    </div>
                    <div class="card-content">
                        <h3>{{ p[1] }}</h3>
                        <p class="price">Rs. {{ p[2] }}</p>
                        <a class="buy-btn"
                           href="https://wa.me/923325359644?text=I%20want%20to%20buy%20{{ p[1] | urlencode }}"
                           target="_blank">
                            Buy Now
                        </a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
            <p class="no-products">No products available yet. Check back soon!</p>
            {% endif %}
        </div>
    </div>

    <script>
        setTimeout(() => {
            document.getElementById("intro").style.display = "none";
            document.getElementById("main").style.display = "block";
        }, 3000);
    </script>
</body>
</html>
