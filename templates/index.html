<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL NOOR ONLINE STORE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(to bottom, #111, #1a1a1a);
    color: white;
    text-align: center;
}

#intro {
    position: fixed;
    width: 100%;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#intro h1 {
    color: #00ffcc;
    font-size: 42px;
    animation: zoom 2s ease-in-out;
}

@keyframes zoom {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

#main {
    display: none;
    padding: 30px 20px;
}

h2 {
    margin-bottom: 30px;
    font-size: 32px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
    justify-items: center;
}

.card {
    width: 240px;
    background: #222;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.03);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.card-content {
    padding: 15px;
}

.price {
    color: #00ffcc;
    margin-bottom: 10px;
    font-size: 18px;
}

/* BUTTON FIX */
.buy-btn {
    display: inline-block;
    background: #00ffcc;
    color: black;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="intro">
    <h1>AL NOOR ONLINE STORE</h1>
</div>

<div id="main">

<h2>🛒 AL NOOR ONLINE STORE</h2>

<div class="products">

<!-- PRODUCT 1 -->
<div class="card">
    <img src="{{ url_for('static', filename='watch.jpg') }}">
    <div class="card-content">
        <h3>Smart Watch</h3>
        <p class="price">Rs. 799</p>
        <a class="buy-btn"
           href="https://wa.me/923325359644?text=I%20want%20to%20buy%20Smart%20Watch"
           target="_blank">
           Buy Now
        </a>
    </div>
</div>

<!-- PRODUCT 2 -->
<div class="card">
    <img src="{{ url_for('static', filename='hand_free.png') }}">
    <div class="card-content">
        <h3>Hand Free</h3>
        <p class="price">Rs. 499</p>
        <a class="buy-btn"
           href="https://wa.me/923325359644?text=I%20want%20to%20buy%20Handfree"
           target="_blank">
           Buy Now
        </a>
    </div>
</div>

<!-- PRODUCT 3 -->
<div class="card">
    <img src="{{ url_for('static', filename='usb.jpg') }}">
    <div class="card-content">
        <h3>USB Cable</h3>
        <p class="price">Rs. 499</p>
        <a class="buy-btn"
           href="https://wa.me/923325359644?text=I%20want%20to%20buy%20USB%20Cable"
           target="_blank">
           Buy Now
        </a>
    </div>
</div>

<!-- PRODUCT 4 -->
<div class="card">
    <img src="{{ url_for('static', filename='fast_charger.jpg') }}">
    <div class="card-content">
        <h3>Fast Charger</h3>
        <p class="price">Rs. 699</p>
        <a class="buy-btn"
           href="https://wa.me/923325359644?text=I%20want%20to%20buy%20Fast%20Charger"
           target="_blank">
           Buy Now
        </a>
    </div>
</div>

</div>
</div>

<script>
setTimeout(() => {
    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";
}, 3000);
</script>

</body>
</html>
